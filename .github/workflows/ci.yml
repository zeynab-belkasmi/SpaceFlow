name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a running check when a newer commit is pushed to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json says, and fails if it is out of date.
      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Fails if coverage of domain/ and application/ drops below 85%.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
